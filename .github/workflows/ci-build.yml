name: CI Build

# Triggers:
# - PR opened/synchronize → 3 platforms build in parallel and upload bundles
#   as workflow Artifacts so the reviewer can download a real binary and
#   smoke-test it before merging.
# - workflow_dispatch → ad-hoc rebuild on demand for any branch.
#
# Release uploads (draft GitHub Release) live in `release.yml`, triggered by
# `v*` tag push. This workflow never touches releases.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# A new push to the same PR cancels the in-progress build for that PR. The
# 3-OS matrix is expensive (especially macOS); no point burning minutes on
# stale commits.
concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Globs are restricted to the installer/distribution artifact itself.
          # `**` would also pick up tauri's intermediate build helpers
          # (bundle_dmg.sh, support/, .icns templates etc.) that get dumped
          # into the same dirs, which clutters the downloaded zip.
          - platform: macos-latest
            label: macos-arm64
            bundle_glob: 'src-tauri/target/release/bundle/dmg/*.dmg'
          - platform: ubuntu-22.04
            label: linux-x86_64
            bundle_glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            label: windows-x86_64
            bundle_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # Build-only mode: empty tagName tells tauri-action not to create or
      # touch any GitHub Release. We just want the bundles on disk so we can
      # upload them as workflow Artifacts in the next step.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty tagName puts tauri-action into build-only mode: it builds
          # the bundles to src-tauri/target/release/bundle/ but never creates
          # or touches a GitHub Release. release.yml owns release uploads.
          tagName: ''

      - name: Upload ${{ matrix.label }} bundle
        uses: actions/upload-artifact@v7
        with:
          name: xangi-pets-${{ matrix.label }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
          retention-days: 14
