name: CI Build

# Triggers:
# - PR opened/synchronize → build the macOS bundle and upload it as a
#   workflow Artifact so the reviewer can smoke-test it before merging.
# - workflow_dispatch → ad-hoc rebuild on demand for any branch.
#
# Release uploads (draft GitHub Release) live in `release.yml`, triggered by
# `v*` tag push. This workflow never touches releases.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# A new push to the same PR cancels the in-progress build for that PR. The
# macOS builds are expensive; no point burning minutes on stale commits.
concurrency:
  group: ci-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # Build-only mode: empty tagName tells tauri-action not to create or
      # touch any GitHub Release. We just want the bundles on disk so we can
      # upload them as workflow Artifacts in the next step.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty tagName puts tauri-action into build-only mode: it builds
          # the bundles to src-tauri/target/release/bundle/ but never creates
          # or touches a GitHub Release. release.yml owns release uploads.
          tagName: ''

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: xangi-pets-macos-arm64
          path: 'src-tauri/target/release/bundle/dmg/*.dmg'
          if-no-files-found: error
          retention-days: 3
