[package]
name = "xangi-pets"
version = "0.0.9"
description = "Desktop floating pets for xangi"
authors = ["karaage0703"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "xangi_pets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/events-server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Embedded HTTP server (replaces the old Node sidecar in server/).
xangi-events-server = { path = "crates/events-server" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-notification = "2"
